info:
  title: Samrajya Dwarpal
  description: Users and authentication service for Project Samrajya
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://samrajya-dwarpal.onrender.com
    description: Preview
  - url: https://samrajya-dwarpal-prod.onrender.com
    description: Production
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 2b18e2b0-9f3a-4c1d-9c9a-4b0f2b1a1d2e
        username:
          type: string
          example: rishab
          description: Lowercased canonical form
        emailAddress:
          type: string
          example: rishab@example.com
          description: Lowercased canonical form
        firstName:
          type: string
          example: Rishab
        lastName:
          type: string
          example: Jaiswal
        phoneNumber:
          type: string
          example: null
          nullable: true
        role:
          type: string
          enum:
            - admin
            - user
          example: user
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          example: null
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - emailAddress
        - firstName
        - lastName
        - phoneNumber
        - role
        - lastLoginAt
        - emailVerifiedAt
        - createdAt
        - updatedAt
    UpdateMeDto:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Rishab
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Jaiswal
        phoneNumber:
          type: string
          nullable: true
          example: '9876543210'
          pattern: ^[6-9]\d{9}$
          description: 10-digit Indian mobile number; must be unique. Pass null to clear the stored value.
    LoginDto:
      type: object
      properties:
        identifier:
          type: string
          description: Email address or username. Trimmed and lowercased.
          example: rishab@example.com
          maxLength: 255
        password:
          type: string
          description: Account password
          example: correct horse battery staple
          minLength: 1
          maxLength: 128
      required:
        - identifier
        - password
    TokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT bearer token. Sent in Authorization: Bearer <accessToken>.'
        accessTokenExpiresIn:
          type: number
          description: Lifetime of the access token in seconds
          example: 900
        refreshToken:
          type: string
          description: Opaque refresh token. Submit to /v1/auth/refresh to rotate.
        refreshTokenExpiresAt:
          type: string
          description: Absolute expiry of the refresh token (ISO 8601 UTC)
          example: '2026-11-24T12:00:00.000Z'
      required:
        - accessToken
        - accessTokenExpiresIn
        - refreshToken
        - refreshTokenExpiresAt
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Opaque refresh token issued by /v1/auth/login or /v1/auth/refresh
          example: bXktb3BhcXVlLXJlZnJlc2gtdG9rZW4td2l0aC1zdHVmZg
          minLength: 16
          maxLength: 512
      required:
        - refreshToken
    RegisterDto:
      type: object
      properties:
        username:
          type: string
          description: Letters, digits, dot, underscore, hyphen. Trimmed and lowercased on save.
          example: rishab.jaiswal
          minLength: 3
          maxLength: 30
        emailAddress:
          type: string
          example: rishab@example.com
          maxLength: 255
        firstName:
          type: string
          example: Rishab
          maxLength: 100
        lastName:
          type: string
          example: Jaiswal
          maxLength: 100
        password:
          type: string
          description: Argon2id-hashed on the server. Never stored or logged raw.
          minLength: 8
          maxLength: 128
        phoneNumber:
          type: string
          example: '9876543210'
          pattern: ^[6-9]\d{9}$
          description: 10-digit Indian mobile number; must be unique.
      required:
        - username
        - emailAddress
        - firstName
        - lastName
        - password
    AvailabilityResponseDto:
      type: object
      properties:
        available:
          type: boolean
          example: true
      required:
        - available
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          example: current password here
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          example: a new sufficiently long password
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword
    PaginatedUsersDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponseDto'
        total:
          type: number
          example: 42
          description: Total matching rows across all pages
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
      required:
        - data
        - total
        - page
        - limit
    UpdateRoleDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - admin
            - user
          example: admin
      required:
        - role
